<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />

    <title>Digital Business Card</title>
    <meta
      name="description"
      content="Contact information and digital business card."
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="canonical" href="https://danward824-stack.github.io/nfc-card/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital Business Card" />
    <meta property="og:description" content="Contact information and digital business card." />
    <meta property="og:site_name" content="WardTap" />
    <meta property="og:url" content="https://danward824-stack.github.io/nfc-card/" />
    <meta property="og:image" content="https://wardtap.com/assets/previews/wardtap.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Digital Business Card" />
    <meta name="twitter:description" content="Contact information and digital business card." />
    <meta name="twitter:image" content="https://wardtap.com/assets/previews/wardtap.png" />

    <link
      id="site-icon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d1d1f'/%3E%3C/svg%3E"
    />

    <script>
      // GitHub Pages uses a project subpath; a custom domain serves the site from root.
      window.SITE_BASE_PATH = window.location.protocol === "file:"
        ? "./"
        : window.location.hostname.endsWith("github.io")
          ? "/nfc-card/"
          : "/";
    </script>
    <link id="site-stylesheet" rel="stylesheet" />
    <script>
      document.getElementById("site-stylesheet").href = `${window.SITE_BASE_PATH}styles.css`;
    </script>
  </head>
  <body>
    <main>
      <section class="home" id="home-view" aria-labelledby="home-title" hidden>
        <div class="home-content">
          <h1 class="home-title" id="home-title">WardTap</h1>
          <p class="home-tagline">Tap. Connect. Share.</p>
          <p class="home-description">Digital profiles built for a tap.</p>
        </div>
      </section>

      <article class="card" id="profile-view" aria-labelledby="contact-name" hidden>
        <div class="portrait-wrap">
          <span id="portrait-fallback" aria-hidden="true"></span>
          <img
            id="portrait"
            class="portrait"
            alt=""
            width="232"
            height="232"
            decoding="async"
            fetchpriority="high"
          />
        </div>

        <h1 id="contact-name"></h1>
        <p class="role" id="contact-role">
          <span id="contact-title"></span>
          <span class="organization" id="contact-organization"></span>
        </p>

        <p class="headline" id="contact-bio"></p>

        <div id="primary-action"></div>

        <nav class="actions" id="contact-actions" aria-label="Contact options"></nav>
        <div class="sections" id="profile-sections" hidden></div>
      </article>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <script>
      const themeScript = document.createElement("script");
      themeScript.src = `${window.SITE_BASE_PATH}themes.js`;
      themeScript.onload = () => {
        const profileDataScript = document.createElement("script");
        profileDataScript.src = `${window.SITE_BASE_PATH}profiles.js`;
        profileDataScript.onload = () => {
        const appScript = document.createElement("script");
        appScript.src = `${window.SITE_BASE_PATH}app.js`;
        document.body.append(appScript);
        };
        document.body.append(profileDataScript);
      };
      document.body.append(themeScript);
    </script>
  </body>
</html>
