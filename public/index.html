<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />

    <title>Digital Business Card</title>
    <meta
      name="description"
      content="Contact information and digital business card."
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="canonical" href="https://danward824-stack.github.io/nfc-card/" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Digital Business Card" />
    <meta property="og:description" content="Contact information and digital business card." />
    <meta property="og:site_name" content="Digital Business Card" />
    <meta property="og:url" content="https://danward824-stack.github.io/nfc-card/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Digital Business Card" />
    <meta name="twitter:description" content="Contact information and digital business card." />

    <link
      id="site-icon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d1d1f'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        color-scheme: light;
        --page: #f5f5f7;
        --surface: #ffffff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --hairline: rgba(29, 29, 31, 0.1);
        --accent: #0071e3;
        --accent-pressed: #0068d1;
        --secondary: #f5f5f7;
        --radius-large: 28px;
        --radius-medium: 15px;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
        --content-width: 420px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        -webkit-text-size-adjust: 100%;
        background: var(--page);
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        padding: max(12px, env(safe-area-inset-top)) 12px
          max(16px, env(safe-area-inset-bottom));
        display: grid;
        place-items: start center;
        color: var(--text);
        background: var(--page);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial,
          sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, var(--content-width));
      }

      .card {
        padding: 28px 20px 18px;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-large);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .portrait-wrap {
        width: 104px;
        height: 104px;
        margin: 0 auto 18px;
        overflow: hidden;
        display: grid;
        place-items: center;
        border: 1px solid var(--hairline);
        border-radius: 50%;
        background: #e8e8ed;
        color: var(--muted);
        font-size: 34px;
        font-weight: 650;
        letter-spacing: -0.04em;
      }

      .portrait {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 9vw, 36px);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .role {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.4;
      }

      .organization {
        display: block;
        color: var(--text);
        font-weight: 600;
      }

      .headline {
        max-width: 34ch;
        margin: 20px auto 22px;
        color: var(--muted);
        font-size: 15.5px;
        line-height: 1.5;
        text-wrap: balance;
      }

      .button {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: var(--radius-medium);
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: transform 120ms ease, background-color 120ms ease;
      }

      .button:active {
        transform: scale(0.985);
      }

      .button:focus-visible {
        outline: 3px solid rgba(0, 113, 227, 0.32);
        outline-offset: 3px;
      }

      .primary {
        width: 100%;
        padding: 0 20px;
        color: #ffffff;
        background: var(--accent);
      }

      .primary:active {
        background: var(--accent-pressed);
      }

      .primary svg {
        width: 20px;
        height: 20px;
      }

      .actions {
        margin-top: 14px;
        padding-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
        gap: 8px;
        border-top: 1px solid var(--hairline);
      }

      .action {
        min-width: 0;
        min-height: 48px;
        color: var(--accent);
        background: var(--secondary);
        border-radius: 13px;
        font-size: 14px;
        font-weight: 550;
      }

      .action:hover {
        background: rgba(0, 113, 227, 0.06);
      }

      .actions[data-count="4"] {
        grid-template-columns: repeat(2, 1fr);
      }

      @media (max-height: 650px) {
        .card {
          padding-top: 20px;
        }

        .portrait-wrap {
          width: 84px;
          height: 84px;
          margin-bottom: 14px;
        }

        .headline {
          margin-top: 14px;
          margin-bottom: 16px;
        }
      }

      @media (max-width: 360px) {
        body {
          padding-right: 8px;
          padding-left: 8px;
        }

        .card {
          padding-right: 16px;
          padding-left: 16px;
          border-radius: 22px;
        }

        .actions {
          gap: 6px;
        }
      }

      @media (min-width: 700px) {
        body {
          padding: 48px 24px;
          place-items: center;
        }

        .card {
          padding: 40px 34px 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" aria-labelledby="contact-name">
        <div class="portrait-wrap">
          <span id="portrait-fallback" aria-hidden="true"></span>
          <img
            id="portrait"
            class="portrait"
            alt=""
            width="232"
            height="232"
            decoding="async"
            fetchpriority="high"
          />
        </div>

        <h1 id="contact-name"></h1>
        <p class="role" id="contact-role">
          <span id="contact-title"></span>
          <span class="organization" id="contact-organization"></span>
        </p>

        <p class="headline" id="contact-bio"></p>

        <a class="button primary" id="add-contact" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" stroke-linecap="round" />
          </svg>
          Add to Contacts
        </a>

        <nav class="actions" id="contact-actions" aria-label="Contact options"></nav>
      </article>
    </main>

    <script>
      // GitHub Pages uses a project subpath; a custom domain serves the site from root.
      window.SITE_BASE_PATH = window.location.protocol === "file:"
        ? "./"
        : window.location.hostname.endsWith("github.io")
          ? "/nfc-card/"
          : "/";
      const profileDataScript = document.createElement("script");
      profileDataScript.src = `${window.SITE_BASE_PATH}profiles.js`;
      profileDataScript.onload = () => {
        const appScript = document.createElement("script");
        appScript.src = `${window.SITE_BASE_PATH}app.js`;
        document.body.append(appScript);
      };
      document.body.append(profileDataScript);
    </script>
  </body>
</html>
